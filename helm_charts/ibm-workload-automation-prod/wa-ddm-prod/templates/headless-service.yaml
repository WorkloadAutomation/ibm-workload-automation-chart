{{ include "wa.init" (list . "waddm") }}
{{- $serviceName := include "wa.fullName" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}-h
  labels:
{{ include "wa.ddm.labels" . | indent 4 }}
  annotations:
    prometheus.io/scrape: {{ .Values.global.enablePrometheus | quote | default "true" }}
    prometheus.io/scheme: http
    prometheus.io/port: "31115"
    prometheus.io/path: /metrics
spec:
  clusterIP: None
  ports:
  - name: ita-port
    protocol: TCP
    port: 31114
    targetPort: 31114
  - name: server-netman
    protocol: TCP
    port: 31111
    targetPort: 31111
  - name: server-netman-ssl
    protocol: TCP
    port: 31113
    targetPort: 31113
  - name: https-port
    protocol: TCP
    port: 31116
    targetPort: 31116
  - name: server-eif
    protocol: TCP
    port: 31131
    targetPort: 31131
  - name: monitoring-port
    protocol: TCP
    port: 31115
    targetPort: 31115
  selector:
    app.kubernetes.io/name: "{{ include "wa.appName" . }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"