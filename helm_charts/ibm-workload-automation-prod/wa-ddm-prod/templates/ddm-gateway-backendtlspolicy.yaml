{{- if and (eq (.Values.ddm.exposeServiceType | upper) "GATEWAYAPI") (.Values.ddm.gatewayApi.enabled) (.Values.ddm.gatewayApi.backendTLSPolicy.enabled) }}
{{- if or (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/BackendTLSPolicy") .Values.ddm.gatewayApi.skipLibraryCheck }}
