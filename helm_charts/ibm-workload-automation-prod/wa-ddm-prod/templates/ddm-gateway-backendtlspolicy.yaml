{{- include "wa.init" (list . "waddm") }}
{{- $ddmServiceName := include "waDdm.ServiceName" . -}}
{{- $caSecretName := .Values.ddm.gatewayApi.backendTLSPolicy.caCertificateSecretName | default .Values.ddm.certSecretName -}}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ printf "%s-tls" $ddmServiceName }}
  labels:
{{ include "wa.ddm.labels" . | indent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ $ddmServiceName }}
  validation:
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: {{ $caSecretName }}
    hostname: {{ .Values.ddm.gatewayApi.backendTLSPolicy.hostname | default $ddmServiceName | quote }}
{{- if .Values.ddm.enableSingleInstaceNetwork }}
{{- $root := . }}
{{- range $i, $e := until (.Values.replicaCount | int) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ printf "%s-%d-tls" $ddmServiceName $i }}
  labels:
{{ include "wa.ddm.labels" $root | indent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ printf "%s-%d" $ddmServiceName $i }}
  validation:
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: {{ $caSecretName }}
    hostname: {{ $root.Values.ddm.gatewayApi.backendTLSPolicy.hostname | default (printf "%s-%d" $ddmServiceName $i) | quote }}
{{- end }}
{{- end }}
{{- else -}}
# WARNING: gateway.networking.k8s.io/v1/BackendTLSPolicy is not available on this cluster.
# Skipping BackendTLSPolicy for DDM.
{{- end }}
{{- end }}