{{- include "wa.init" (list . "waddm") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ddm-network-policy
  labels:
{{ include "wa.ddm.labels" . | indent 4 }}
spec:
  policyTypes:
  - Ingress
  podSelector:
    matchLabels:
{{ include "wa.ddm.labels" . | indent 6 }}
  ingress:
  - ports:
      - protocol: TCP
        port: 31116
      - protocol: TCP
        port: 31114
      - protocol: TCP
        port: 31111
      - protocol: TCP
        port: 31131
      - protocol: TCP
        port: 31134
      - protocol: TCP
        port: 31115
      - protocol: TCP
        port: 31113
      - protocol: TCP
        port: 41114
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ddm-to-ddm-network-policy
  labels:
{{ include "wa.ddm.labels" . | indent 4 }}
spec:
  podSelector: 
    matchLabels:
      app.kubernetes.io/name: waddm
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: waddm
  policyTypes:
  - Ingress