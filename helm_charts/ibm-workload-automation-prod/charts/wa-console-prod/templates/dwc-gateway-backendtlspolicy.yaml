{{- if and (eq (.Values.console.exposeServiceType | upper) "GATEWAYAPI") (.Values.console.gatewayApi.enabled) (.Values.console.gatewayApi.backendTLSPolicy.enabled) }}
{{- if or (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/BackendTLSPolicy") .Values.console.gatewayApi.skipLibraryCheck }}
