{{- include "wa.init" (list . "waconsole") }}
{{- $dwcServiceName := include "wa.fullName" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ printf "%s-tls" $dwcServiceName | quote }}
  labels:
{{ include "wa.console.labels" . | indent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ $dwcServiceName | quote }}
  validation:
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: {{ .Values.console.gatewayApi.backendTLSPolicy.caCertificateSecretName | default .Values.console.certSecretName | quote }}
    hostname: {{ .Values.console.gatewayApi.backendTLSPolicy.hostname | default $dwcServiceName | quote }}
{{- else -}}
# WARNING: gateway.networking.k8s.io/v1/BackendTLSPolicy is not available on this cluster.
# Skipping BackendTLSPolicy for console.
{{- end }}
{{- end }}