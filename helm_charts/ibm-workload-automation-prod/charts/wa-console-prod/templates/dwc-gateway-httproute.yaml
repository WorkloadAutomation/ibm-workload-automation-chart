{{- include "wa.init" (list . "waconsole") }}
{{- $fullName := include "wa.fullName" . }}
{{- $dwcServiceName := include "wa.fullName" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-gateway-route" $dwcServiceName | quote }}
  labels:
{{ include "wa.console.labels" . | indent 4 }}
  {{- with .Values.console.gatewayApi.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- if .Values.console.gatewayApi.parentRefs }}
    {{- toYaml .Values.console.gatewayApi.parentRefs | nindent 4 }}
    {{- else }}
    - name: {{ .Values.console.gatewayApi.gatewayName | quote }}
      namespace: {{ .Values.console.gatewayApi.gatewayNamespace | default .Release.Namespace | quote }}
    {{- end }}
  hostnames:
    {{- if .Values.console.gatewayApi.hostnames }}
    {{- range .Values.console.gatewayApi.hostnames }}
    - {{ . | quote }}
    {{- end }}
    {{- else if .Values.console.ingress.hostname }}
    - {{ .Values.console.ingress.hostname | quote }}
    {{- else }}
    - {{ printf "%s.%s.%s.mycluster.proxy" $fullName .Release.Name .Release.Namespace | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.console.gatewayApi.pathPrefix | default "/" | quote }}
      backendRefs:
        - name: {{ $dwcServiceName | quote }}
          port: {{ .Values.servicePort | default 9443 }}
          {{- with .Values.console.gatewayApi.backendConfig }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
{{- else -}}
  {{- fail "\nERROR: Gateway API is enabled for console, but HTTPRoute CRD is not installed on the cluster.\n" }}
{{- end }}  
{{- end }}