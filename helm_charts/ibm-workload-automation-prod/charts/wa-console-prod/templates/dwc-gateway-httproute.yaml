{{- if and (eq (.Values.console.exposeServiceType | upper) "GATEWAYAPI") (.Values.console.gatewayApi.enabled) }}
{{- if or (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/HTTPRoute") .Values.console.gatewayApi.skipLibraryCheck }}
