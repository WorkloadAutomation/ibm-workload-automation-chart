{{- if and (eq (.Values.server.exposeServiceType | upper) "GATEWAYAPI") (.Values.server.gatewayApi.enabled) }}
{{- if or (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/HTTPRoute") .Values.server.gatewayApi.skipLibraryCheck }}
