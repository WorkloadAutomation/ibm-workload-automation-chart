{{- if and (eq (.Values.server.exposeServiceType | upper) "GATEWAYAPI") (.Values.server.gatewayApi.enabled) (.Values.server.gatewayApi.backendTLSPolicy.enabled) }}
{{- if or (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/BackendTLSPolicy") .Values.server.gatewayApi.skipLibraryCheck }}
