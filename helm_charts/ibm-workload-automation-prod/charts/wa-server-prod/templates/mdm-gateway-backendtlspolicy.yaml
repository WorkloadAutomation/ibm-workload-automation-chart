{{- include "wa.init" (list . "waserver") }}
{{- $mdmServiceName := include "waMdm.ServiceName" . }}
{{- $caSecretName := .Values.server.gatewayApi.backendTLSPolicy.caCertificateSecretName | default .Values.server.certSecretName }}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ printf "%s-tls" $mdmServiceName }}
  labels:
{{ include "wa.server.labels" . | indent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ $mdmServiceName }}
  validation:
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: {{ $caSecretName }}
    hostname: {{ .Values.server.gatewayApi.backendTLSPolicy.hostname | default $mdmServiceName | quote }}
{{- if .Values.server.enableSingleInstaceNetwork }}
{{- $root := . }}
{{- range $i, $e := until (.Values.replicaCount | int) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ printf "%s-%d-tls" $mdmServiceName $i }}
  labels:
{{ include "wa.server.labels" $root | indent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ printf "%s-%d" $mdmServiceName $i }}
  validation:
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: {{ $caSecretName }}
    hostname: {{ $root.Values.server.gatewayApi.backendTLSPolicy.hostname | default (printf "%s-%d" $mdmServiceName $i) | quote }}
{{- end }}
{{- end }}
{{- else -}}
# WARNING: gateway.networking.k8s.io/v1/BackendTLSPolicy is not available on this cluster.
# Skipping BackendTLSPolicy for server.
{{- end }}
{{- end }}