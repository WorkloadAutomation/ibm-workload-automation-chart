{{- $fullName := include "wa-fileproxy-prod.fullname" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ printf "%s-tls" $fullName | quote }}
  labels:
    {{- include "wa-fileproxy-prod.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ $fullName | quote }}
  validation:
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: {{ .Values.fileProxy.gatewayApi.backendTLSPolicy.caCertificateSecretName | default .Values.fileProxy.certSecretName | quote }}
    hostname: {{ .Values.fileProxy.gatewayApi.backendTLSPolicy.hostname | default $fullName | quote }}
{{- else -}}
# WARNING: gateway.networking.k8s.io/v1/BackendTLSPolicy is not available on this cluster.
# Skipping BackendTLSPolicy for fileproxy.
{{- end }}
{{- end }}