{{- if and (eq (.Values.fileProxy.exposeServiceType | upper) "GATEWAYAPI") (.Values.fileProxy.gatewayApi.enabled) (.Values.fileProxy.gatewayApi.backendTLSPolicy.enabled) }}
{{- if or (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/BackendTLSPolicy") .Values.fileProxy.gatewayApi.skipLibraryCheck }}
