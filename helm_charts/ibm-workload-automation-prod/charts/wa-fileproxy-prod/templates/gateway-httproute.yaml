{{- if and (eq (.Values.fileProxy.exposeServiceType | upper) "GATEWAYAPI") (.Values.fileProxy.gatewayApi.enabled) }}
{{- if or (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/HTTPRoute") .Values.fileProxy.gatewayApi.skipLibraryCheck }}
